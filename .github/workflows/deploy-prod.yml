name: Build & Deploy (Prod)

on:
  push:
    tags: ['v*']

env:
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/digi-carts/digi-cart/digi-cart-service-monitor
  SERVICE: digi-cart-service-monitor

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Cloud Run (prod)
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --image ${{ env.IMAGE }}:${{ github.ref_name }} \
            --set-env-vars "GCP_PROJECT_ID=digi-carts,GCP_REGION=us-east1" \
            --allow-unauthenticated \
            --port 3010 \
            --quiet
