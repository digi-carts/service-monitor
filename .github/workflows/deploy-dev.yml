name: Build & Deploy (Dev)

on:
  push:
    branches: [stage]

env:
  REGION: us-east1
  IMAGE: us-east1-docker.pkg.dev/digi-carts-dev/digi-cart/digi-cart-service-monitor
  SERVICE: digi-cart-service-monitor-dev

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP
        run: |
          echo '${{ secrets.GCP_DEV_SA_KEY }}' > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          gcloud config set project digi-carts-dev
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Cloud Run (dev)
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --image ${{ env.IMAGE }}-dev:latest \
            --set-env-vars "GCP_PROJECT_ID=digi-carts-dev,GCP_REGION=us-east1" \
            --no-allow-unauthenticated \
            --port 3010 \
            --quiet
